name: Optional Provider Live Smoke (Manual/Scheduled)

on:
  schedule:
    - cron: "37 14 * * *" # Run at 7:37 AM Pacific Time (14:37 UTC) every day
  workflow_dispatch: # Allows triggering the workflow manually in GitHub UI

# If another scheduled run starts while this workflow is still running,
# cancel the earlier run in favor of the next run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-live-smoke:
    name: Provider Live Smoke (Optional Manual/Scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv
          uv pip install .
      - name: Run optional provider/live smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          REACT_AGENT_CHECKPOINTER: memory
        run: uv run python scripts/quality/run_provider_live_smoke.py --out-dir ops/regression/provider/out
      - name: Upload provider smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-live-smoke-artifact
          path: ops/regression/provider/out/provider_live_smoke.json
